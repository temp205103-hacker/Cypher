[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher"
version = "0.1.0"
description = "Windows-first local security companion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<14",
  "psutil>=5.9,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyYAML>=6,<7",
  "keyring>=25,<26",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
camera = ["opencv-python>=4.10,<5", "mss>=9,<10"]
windows = ["winsdk>=1.0,<2"]

[project.scripts]
"cypher" = "cypher.cli:main"

[tool.setuptools.packages.find]
include = ["cypher*"]

[tool.setuptools.package-data]
"cypher.rules.yara" = ["*.yar"]
"cypher" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
