<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cypher blocked this domain</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #172033; background: #f3f6fb; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { width: min(620px, calc(100vw - 36px)); padding: 28px; border: 1px solid #d5deeb; border-radius: 16px; background: #fff; box-shadow: 0 18px 60px #10204020; }
    .brand { color: #087c78; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
    h1 { margin: 12px 0; color: #a51d24; font-size: 28px; }
    p { line-height: 1.55; }
    code { display: block; overflow-wrap: anywhere; margin: 18px 0; padding: 12px; border-radius: 8px; background: #f1f4f8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { min-height: 40px; padding: 8px 14px; border: 1px solid #c8d2e0; border-radius: 8px; color: #172033; background: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #168d88; outline-offset: 2px; }
    #back { color: #fff; background: #087c78; border-color: #087c78; }
    #proceed { color: #a51d24; }
    #why { padding-top: 12px; border-top: 1px solid #e1e7ef; }
    .notice { color: #59677a; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">CYPHER · PHISHING GUARD</div>
    <h1>Cypher blocked this domain</h1>
    <p id="description">This domain is on your local phishing blocklist. Cypher stopped the navigation before the page loaded.</p>
    <code id="domain">(unknown domain)</code>
    <p id="why" hidden></p>
    <div class="actions">
      <button id="back" type="button">Go back to safety</button>
      <button id="why-button" type="button">Why was this blocked?</button>
      <button id="proceed" type="button">Proceed anyway</button>
    </div>
    <p class="notice">Proceeding requires confirmation and temporarily allows this domain for five minutes. It is recorded locally.</p>
  </main>
  <script src="warning.js"></script>
</body>
</html>
